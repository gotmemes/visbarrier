buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net' }
        maven { url 'https://repo.spongepowered.org/maven' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.3'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = 1.8

minecraft {
    version = "${project.loader_version}-${project.minecraft_version}"
    runDir = 'run'
    mappings = 'stable_22'
    makeObfSourceJar = false

    ['mod_id', 'mod_name', 'mod_version', 'accepted_minecraft_versions'].each { property ->
        replace "@${property.toUpperCase()}@", project.hasProperty(property) ? project[property] : null
    }

    clientRunArgs += [
            '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker',
            '--mixin', "${project.mod_id}.mixins.json"
    ]
}

mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
}

// All compat subprojects are isolated GradleBuild tasks. setupCIWorkspace runs once to
// populate the forgeBin cache; subsequent builds skip it (up-to-date check on outputs.file).
task buildCompat1_9(type: GradleBuild) {
    dir = file('compat_1_9')
    tasks = ['setupCIWorkspace', 'build']
    inputs.dir 'compat_1_9/src'
    outputs.file 'compat_1_9/build/libs/compat_1_9-0.jar'
}

task buildCompat1_11(type: GradleBuild) {
    dir = file('compat_1_11')
    tasks = ['setupCIWorkspace', 'build']
    inputs.dir 'compat_1_11/src'
    outputs.file 'compat_1_11/build/libs/compat_1_11-0.jar'
}

task buildCompat1_12(type: GradleBuild) {
    dir = file('compat_1_12')
    tasks = ['setupCIWorkspace', 'build']
    inputs.dir 'compat_1_12/src'
    outputs.file 'compat_1_12/build/libs/compat_1_12-0.jar'
}

configurations {
    embed
    compile.extendsFrom(embed)
}

repositories {
    maven { url 'https://repo.spongepowered.org/maven/' }
}

dependencies {
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        transitive = false
    }
}

processResources {
    def propertyMap = (file('src/main/resources/mcmod.info').text =~ /\$\{([\w.]+)}/)
            .collect { it[1] }
            .unique()
            .collectEntries { [(it): project.hasProperty(it) ? project[it] : it] }

    inputs.properties propertyMap

    filesMatching('mcmod.info') {
        expand propertyMap
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec) {
    outputs.upToDateWhen { false }
}

afterEvaluate {
    // FG 2.1.x fetches MC assets over HTTP; the CDN now returns 400 for HTTP requests.
    // Try both names used across FG 2.x versions. Game runs fine from previously-cached assets.
    ['getAssets', 'downloadAssets'].each { name -> tasks.findByName(name)?.enabled = false }
}

jar {
    dependsOn configurations.embed, buildCompat1_9, buildCompat1_11, buildCompat1_12

    manifest.attributes(
            'TweakOrder': 0,
            'ModSide': 'CLIENT',
            'MixinConfigs': "visbarrier.mixins.json,visbarrier_1_9.mixins.json,visbarrier_1_12.mixins.json",
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'ForceLoadAsMod': true
    )

    from {
        configurations.embed.collect { it.isDirectory() ? fileTree(it) : zipTree(it) }
    } {
        exclude 'META-INF/*', 'LICENSE.txt', 'dummyThing'
    }

    from({ zipTree('compat_1_9/build/libs/compat_1_9-0.jar') }) {
        exclude 'META-INF/*', 'LICENSE.txt', 'dummyThing'
    }

    from({ zipTree('compat_1_11/build/libs/compat_1_11-0.jar') }) {
        exclude 'META-INF/*', 'LICENSE.txt', 'dummyThing'
    }

    from({ zipTree('compat_1_12/build/libs/compat_1_12-0.jar') }) {
        exclude 'META-INF/*', 'LICENSE.txt', 'dummyThing'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
