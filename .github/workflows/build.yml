name: Build

on:
  push:
    branches: [ main, v2 ]
  pull_request:
    branches: [ main, v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: visbarrier-${{ github.sha }}
        path: build/libs/*.jar
        retention-days: 30
